<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fortnite — On This Day</title>
<style>
  :root {
    --bg: #0e1015; --card: #181b23; --card-hover: #1f2430;
    --text: #f2f4f8; --muted: #8b93a7; --accent: #7c5cff; --accent2: #00d4ff; --border: #232733;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: radial-gradient(1200px 600px at 50% -10%, #1b2030 0%, var(--bg) 60%);
    color: var(--text); min-height: 100vh; padding: 44px 24px 80px;
  }
  header { text-align: center; margin-bottom: 22px; }
  h1 {
    font-size: 2.4rem; font-weight: 800; letter-spacing: -0.5px;
    background: linear-gradient(90deg, var(--accent2), var(--accent));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .sub { color: var(--muted); margin-top: 8px; font-size: 1rem; }

  .controls {
    display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; align-items: center;
    max-width: 820px; margin: 0 auto 18px;
  }
  .controls input[type="date"] {
    background: var(--card); color: var(--text); border: 1px solid var(--border);
    border-radius: 12px; padding: 10px 14px; font-size: 1rem; font-weight: 600;
    font-family: inherit; color-scheme: dark;
  }
  .controls input[type="date"]:focus { outline: none; border-color: var(--accent); }
  .btn {
    cursor: pointer; border: 1px solid var(--border); background: var(--card); color: var(--text);
    font-weight: 700; font-size: 0.95rem; padding: 10px 16px; border-radius: 12px;
    transition: all .15s ease; font-family: inherit;
  }
  .btn:hover { background: var(--card-hover); }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn.primary {
    color: #fff; border-color: transparent;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    box-shadow: 0 8px 22px rgba(124,92,255,.35);
  }
  .btn.ghost { font-weight: 600; color: var(--muted); }
  .status { text-align: center; color: var(--muted); min-height: 22px; margin-bottom: 22px; font-size: .95rem; }
  .status.error { color: #ff8585; }

  .tabs { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; max-width: 960px; margin: 0 auto 28px; }
  .tab {
    cursor: pointer; border: 1px solid var(--border); background: var(--card); color: var(--muted);
    font-weight: 700; font-size: 0.98rem; padding: 10px 18px; border-radius: 12px;
    transition: all .16s ease; display: flex; align-items: center; gap: 8px;
  }
  .tab:hover { color: var(--text); background: var(--card-hover); }
  .tab.active {
    color: #fff; border-color: transparent;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    box-shadow: 0 8px 22px rgba(124,92,255,.35);
  }
  .tab .badge { font-size: 0.72rem; font-weight: 700; min-width: 20px; text-align: center; padding: 1px 7px; border-radius: 999px; background: rgba(255,255,255,.14); }
  .tab.empty { opacity: .5; }
  .tab.active .badge { background: rgba(0,0,0,.22); }

  .panel { display: none; max-width: 1180px; margin: 0 auto; }
  .panel.active { display: block; animation: fade .25s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(8px);} to {opacity:1; transform:none;} }
  .panel-head { text-align: center; color: var(--muted); margin-bottom: 26px; font-size: 1.05rem; }
  .panel-head strong { color: var(--text); }
  .grid { display: grid; gap: 22px; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
  .card {
    background: var(--card); border-radius: 16px; overflow: hidden; text-decoration: none; color: inherit;
    display: flex; flex-direction: column; border: 1px solid var(--border);
    transition: transform .18s ease, box-shadow .18s ease, background .18s ease;
  }
  .card:hover { transform: translateY(-6px); background: var(--card-hover); box-shadow: 0 18px 40px rgba(0,0,0,.45), 0 0 0 1px var(--accent); }
  .thumb { position: relative; aspect-ratio: 16 / 9; background: #000; overflow: hidden; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .play { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,.15); opacity: 0; transition: opacity .18s ease; }
  .card:hover .play { opacity: 1; }
  .play svg { width: 58px; height: 58px; filter: drop-shadow(0 4px 10px rgba(0,0,0,.6)); }
  .meta { padding: 16px 18px 20px; display: flex; flex-direction: column; gap: 10px; }
  .chip { align-self: flex-start; font-size: 0.72rem; font-weight: 700; letter-spacing: .4px; text-transform: uppercase; padding: 4px 10px; border-radius: 999px; color: #fff; border: 1px solid rgba(255,255,255,.15); }
  .title { font-size: 1.02rem; font-weight: 600; line-height: 1.35; }
  .empty-state { text-align: center; color: var(--muted); font-style: italic; padding: 60px 0; font-size: 1.1rem; }
  footer { text-align: center; color: var(--muted); margin-top: 64px; font-size: 0.85rem; }
  .spin { display:inline-block; width:14px; height:14px; border:2px solid var(--muted); border-top-color: var(--accent2); border-radius:50%; animation: rot .7s linear infinite; vertical-align:-2px; margin-right:7px;}
  @keyframes rot { to { transform: rotate(360deg);} }
</style>
</head>
<body>
<header>
  <h1>🎮 Fortnite — On This Day</h1>
  <div class="sub" id="sub">Pick a date to see what your favorite streamers uploaded that day, every year.</div>
</header>

<div class="controls">
  <input type="date" id="datePicker">
  <button class="btn primary" id="goBtn">Go</button>
  <button class="btn" id="todayBtn">Today</button>
  <button class="btn ghost" id="rebuildBtn" title="Re-scan YouTube to pick up new uploads">↻ Rebuild library</button>
</div>
<div class="status" id="status"></div>

<div class="tabs" id="tabs"></div>
<div id="panels"></div>
<footer id="foot"></footer>

<script>
  // ── Config ────────────────────────────────────────────────────────────────
  const API_KEY = "AIzaSyDscT_1cq3bPcxyxw8tGwFze3cnxLywNOc";
  const START_YEAR = 2017;
  const LIB_KEY = "ftb-library-v1";
  const MAX_PAGES = 300;                       // safety cap per channel (~15k videos)
  const STREAMERS = [
    { name: "Ninja",    id: "UCAW-NpUFkMyCNrvRSSGIvDQ" },
    { name: "Tfue",     id: "UC9lSZSYpDDE18hoFA7YlBpw" },
    { name: "Myth",     id: "UCvQczq3aHiHRBGEx-BKdrcg" },
    { name: "NickEh30", id: "UCt9nYeSz90lnOnaVFjxFJzw" },
    { name: "Daequan",  id: "UCbJ9W-EexsJSMc4wMPOA9pA" },
  ];

  const COLORS = { Ninja:"#1f9bff", Tfue:"#ff4d4d", Myth:"#9b59ff", NickEh30:"#ff9f1c", Daequan:"#2ecc71" };
  const PALETTE = ["#1f9bff","#ff4d4d","#9b59ff","#ff9f1c","#2ecc71","#ff5ec4","#00d4ff","#ffd23f"];
  function colorFor(name) {
    if (COLORS[name]) return COLORS[name];
    let h = 0; for (const ch of name) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
    return PALETTE[h % PALETTE.length];
  }
  const PLAY = '<svg viewBox="0 0 68 48"><path d="M66.5 7.7a8.6 8.6 0 0 0-6-6C55.2 0 34 0 34 0S12.8 0 7.5 1.6a8.6 8.6 0 0 0-6 6A90 90 0 0 0 0 24a90 90 0 0 0 1.5 16.3 8.6 8.6 0 0 0 6 6C12.8 48 34 48 34 48s21.2 0 26.5-1.6a8.6 8.6 0 0 0 6-6A90 90 0 0 0 68 24a90 90 0 0 0-1.5-16.3z" fill="#f00"/><path d="M27 34.5 45 24 27 13.5z" fill="#fff"/></svg>';
  const decode = (s) => { const t = document.createElement("textarea"); t.innerHTML = s; return t.value; };

  const $ = (id) => document.getElementById(id);
  const pad = (n) => String(n).padStart(2, "0");
  const monthDayLabel = (mon, day) =>
    new Date(2000, mon - 1, day).toLocaleDateString(undefined, { month: "long", day: "numeric" });

  // ── Rendering (same card style) ─────────────────────────────────────────────
  function card(v) {
    const a = document.createElement("a");
    a.className = "card";
    a.href = "https://www.youtube.com/watch?v=" + v.id;
    a.target = "_blank"; a.rel = "noopener";
    a.innerHTML = `
      <div class="thumb">
        <img src="https://i.ytimg.com/vi/${v.id}/hqdefault.jpg" alt="" loading="lazy"
             onerror="this.src='https://img.youtube.com/vi/${v.id}/0.jpg'">
        <div class="play">${PLAY}</div>
      </div>
      <div class="meta">
        <span class="chip" style="background:${colorFor(v.streamer)}">${v.streamer}</span>
        <span class="title"></span>
      </div>`;
    a.querySelector(".title").textContent = decode(v.title);
    return a;
  }

  function render(data, mon, day) {
    const years = Object.keys(data).sort();
    const tabsEl = $("tabs"), panelsEl = $("panels");
    tabsEl.innerHTML = ""; panelsEl.innerHTML = "";
    const total = years.reduce((n, y) => n + data[y].length, 0);
    const md = monthDayLabel(mon, day);

    $("sub").innerHTML = `Every <strong>${md}</strong> from your favorite streamers · click a year to time-travel`;

    let defaultYear = years.filter(y => data[y].length).pop() || years[years.length - 1];

    years.forEach(year => {
      const list = data[year];
      const tab = document.createElement("button");
      tab.className = "tab" + (list.length ? "" : " empty");
      tab.dataset.year = year;
      tab.innerHTML = `${year} <span class="badge">${list.length}</span>`;
      tab.onclick = () => activate(year);
      tabsEl.appendChild(tab);

      const panel = document.createElement("div");
      panel.className = "panel"; panel.dataset.year = year;
      if (list.length) {
        panel.innerHTML = `<div class="panel-head">📅 <strong>${md}, ${year}</strong> · ${list.length} video${list.length === 1 ? "" : "s"}</div>`;
        const grid = document.createElement("div"); grid.className = "grid";
        list.forEach(v => grid.appendChild(card(v)));
        panel.appendChild(grid);
      } else {
        panel.innerHTML = `<div class="empty-state">No uploads from these streamers on ${md}, ${year}. 🕳️</div>`;
      }
      panelsEl.appendChild(panel);
    });
    activate(defaultYear);
  }

  function activate(year) {
    document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t.dataset.year === year));
    document.querySelectorAll(".panel").forEach(p => p.classList.toggle("active", p.dataset.year === year));
  }

  // ── Library (cached upload history; built once, filtered for free) ───────────
  function loadLib() {
    try { return JSON.parse(localStorage.getItem(LIB_KEY)); } catch (e) { return null; }
  }

  function showDate(mon, day) {
    const lib = loadLib();
    if (!lib || !lib.videos || !lib.videos.length) {
      setStatus("No library yet — building it now…");
      return buildLibrary();
    }
    const endYear = new Date().getFullYear();
    const data = {};
    for (let y = START_YEAR; y <= endYear; y++) data[y] = [];
    for (const v of lib.videos) {
      const d = new Date(v.date);
      if (d.getUTCMonth() + 1 === mon && d.getUTCDate() === day) {
        const y = d.getUTCFullYear();
        if (data[y]) data[y].push({ streamer: v.s, id: v.id, title: v.title });
      }
    }
    render(data, mon, day);
    const built = new Date(lib.ts);
    $("foot").innerHTML = `Library: ${lib.videos.length} videos from ${STREAMERS.length} streamers · `
      + `built ${built.toLocaleDateString()} ${built.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})} · `
      + `filtered instantly, no API calls`;
    const total = Object.values(data).reduce((n, a) => n + a.length, 0);
    setStatus(`Showing ${monthDayLabel(mon, day)} — ${total} video${total===1?"":"s"} across the years. Pick any date above.`);
  }

  async function buildLibrary() {
    setControls(false);
    setStatus('<span class="spin"></span>Building your video library (one-time)…');
    let uploads;
    try {
      const ids = STREAMERS.map(s => s.id).join(",");
      const r = await fetch(`https://www.googleapis.com/youtube/v3/channels?part=contentDetails&id=${ids}&key=${API_KEY}`);
      if (!r.ok) throw await apiError(r);
      const j = await r.json();
      uploads = {};
      (j.items || []).forEach(it => uploads[it.id] = it.contentDetails.relatedPlaylists.uploads);
    } catch (e) {
      setControls(true);
      if (e.status === 403) keepOrQuotaMessage();
      else setStatus("Couldn't reach YouTube: " + e.message, true);
      return;
    }

    const all = [];
    let quota = false, failed = false;
    const progress = () => setStatus(`<span class="spin"></span>Building library… ${all.length} videos so far`);

    await Promise.all(STREAMERS.map(async (s) => {
      const pl = uploads[s.id];
      if (!pl) return;
      let token = "", pages = 0;
      while (pages < MAX_PAGES) {
        let j;
        try {
          const url = `https://www.googleapis.com/youtube/v3/playlistItems?part=snippet,contentDetails`
            + `&maxResults=50&playlistId=${pl}&key=${API_KEY}` + (token ? `&pageToken=${token}` : "");
          const r = await fetch(url);
          if (!r.ok) { const er = await apiError(r); if (er.status === 403) quota = true; else failed = true; break; }
          j = await r.json();
        } catch (e) { failed = true; break; }

        let oldest = 9999;
        for (const it of (j.items || [])) {
          const date = it.contentDetails && it.contentDetails.videoPublishedAt;
          const vid = it.contentDetails && it.contentDetails.videoId;
          if (!date || !vid) continue;
          const yr = +date.slice(0, 4);
          oldest = Math.min(oldest, yr);
          if (yr >= START_YEAR) all.push({ s: s.name, id: vid, title: it.snippet.title, date });
        }
        progress();
        token = j.nextPageToken || "";
        if (!token || oldest < START_YEAR) break;   // past our range or no more pages
        pages++;
      }
    }));

    setControls(true);

    if (!all.length) {
      if (quota) keepOrQuotaMessage();
      else setStatus("No videos found. " + (failed ? "Some requests failed — try Rebuild again." : ""), true);
      return;
    }
    const lib = { ts: Date.now(), videos: all };
    try { localStorage.setItem(LIB_KEY, JSON.stringify(lib)); } catch (e) {}
    const p = currentPick() || todayMD();
    showDate(p.mon, p.day);
    if (quota || failed) {
      setStatus($("status").textContent + "  (Note: scan was partial — hit Rebuild later to complete it.)", true);
    }
  }

  function keepOrQuotaMessage() {
    const lib = loadLib();
    if (lib && lib.videos && lib.videos.length) {
      const p = currentPick() || todayMD();
      showDate(p.mon, p.day);
      setStatus("YouTube quota is used up for today, so I kept your existing library. It resets at midnight Pacific.", true);
    } else {
      setStatus("YouTube API quota is used up for today (resets at midnight Pacific). Try Rebuild tomorrow.", true);
    }
  }

  async function apiError(resp) {
    let msg = `HTTP ${resp.status}`;
    try { const j = await resp.json(); msg = (j.error && j.error.message) || msg; } catch (e) {}
    const err = new Error(msg); err.status = resp.status; return err;
  }

  function setStatus(html, isErr) {
    const el = $("status"); el.innerHTML = html; el.classList.toggle("error", !!isErr);
  }
  function setControls(enabled) {
    ["goBtn","todayBtn","rebuildBtn","datePicker"].forEach(id => $(id).disabled = !enabled);
  }

  // ── Wiring ──────────────────────────────────────────────────────────────────
  function currentPick() {
    const v = $("datePicker").value;
    if (!v) return null;
    const [y, m, d] = v.split("-").map(Number);
    return { mon: m, day: d };
  }
  function todayMD() {
    const n = new Date(); return { mon: n.getMonth() + 1, day: n.getDate() };
  }
  function setToday() {
    const now = new Date();
    $("datePicker").value = `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}`;
  }
  function go() { const p = currentPick(); if (p) showDate(p.mon, p.day); }

  $("goBtn").onclick       = go;
  $("datePicker").onchange = go;
  $("todayBtn").onclick    = () => { setToday(); go(); };
  $("rebuildBtn").onclick  = () => buildLibrary();

  // Default = the actual day you open the page; build library on first run.
  setToday();
  showDate(todayMD().mon, todayMD().day);
</script>
</body>
</html>
