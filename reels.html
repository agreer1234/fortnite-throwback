<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Reel Saver">
<meta name="theme-color" content="#0e1015">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<title>Reel Saver</title>
<style>
  :root {
    --bg: #0e1015; --card: #181b23; --text: #f2f4f8; --muted: #8b93a7;
    --border: #232733; --err: #ff6b6b; --ok: #3ddc84;
    --ig1: #feda75; --ig2: #d62976; --ig3: #962fbf; --ig4: #4f5bd5;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: radial-gradient(900px 500px at 50% -10%, #1c1a2e 0%, var(--bg) 60%);
    color: var(--text); min-height: 100vh;
    padding: calc(44px + env(safe-area-inset-top)) 20px calc(60px + env(safe-area-inset-bottom));
    display: flex; flex-direction: column; align-items: center;
  }
  header { text-align: center; margin-bottom: 26px; }
  .logo {
    width: 64px; height: 64px; border-radius: 16px; margin: 0 auto 14px;
    background: linear-gradient(45deg, var(--ig1), var(--ig2) 45%, var(--ig3) 70%, var(--ig4));
    display: flex; align-items: center; justify-content: center; font-size: 30px;
  }
  h1 { font-size: 1.7rem; font-weight: 800; letter-spacing: -0.5px; }
  .sub { color: var(--muted); margin-top: 6px; font-size: 0.95rem; }

  .card {
    width: 100%; max-width: 460px; background: var(--card);
    border: 1px solid var(--border); border-radius: 18px; padding: 18px;
  }
  .row { display: flex; gap: 8px; }
  input[type="url"] {
    flex: 1; min-width: 0; background: #10131a; color: var(--text);
    border: 1px solid var(--border); border-radius: 12px;
    padding: 14px 12px; font-size: 16px; outline: none;
  }
  input[type="url"]:focus { border-color: var(--ig3); }
  button {
    border: none; border-radius: 12px; font-size: 16px; font-weight: 700;
    padding: 14px 16px; cursor: pointer; color: #fff; -webkit-tap-highlight-color: transparent;
  }
  .paste { background: #262b38; }
  .go {
    width: 100%; margin-top: 10px;
    background: linear-gradient(45deg, var(--ig2), var(--ig3), var(--ig4));
  }
  button:disabled { opacity: 0.5; }

  .status { margin-top: 14px; font-size: 0.95rem; color: var(--muted); min-height: 1.3em; text-align: center; }
  .status.err { color: var(--err); }
  .status.ok { color: var(--ok); }
  .spinner {
    display: inline-block; width: 14px; height: 14px; vertical-align: -2px; margin-right: 8px;
    border: 2px solid var(--muted); border-top-color: transparent; border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .result { margin-top: 16px; display: none; }
  .result video {
    width: 100%; border-radius: 12px; background: #000; max-height: 55vh;
  }
  .result .actions { display: flex; gap: 8px; margin-top: 10px; }
  .result .actions > * { flex: 1; text-align: center; }
  a.btn {
    display: block; text-decoration: none; color: #fff; font-weight: 700; font-size: 16px;
    padding: 14px 16px; border-radius: 12px; background: #262b38;
  }
  .save { background: linear-gradient(45deg, #11998e, #38ef7d); color: #06281c !important; }

  footer { margin-top: auto; padding-top: 30px; text-align: center; color: var(--muted); font-size: 0.8rem; max-width: 460px; }
  footer a { color: var(--muted); }
</style>
</head>
<body>
<header>
  <div class="logo">🎬</div>
  <h1>Reel Saver</h1>
  <div class="sub">Paste an Instagram reel link, get the highest-res video</div>
</header>

<div class="card">
  <div class="row">
    <input id="url" type="url" inputmode="url" autocapitalize="off" autocorrect="off"
           placeholder="https://www.instagram.com/reel/…">
    <button class="paste" id="pasteBtn" type="button">Paste</button>
  </div>
  <button class="go" id="goBtn" type="button">Get video</button>
  <div class="status" id="status"></div>

  <div class="result" id="result">
    <video id="preview" controls playsinline preload="metadata"></video>
    <div class="actions">
      <button class="save" id="saveBtn" type="button">Save to Photos</button>
      <a class="btn" id="openLink" target="_blank" rel="noopener">Open file</a>
    </div>
  </div>
</div>

<footer>
  Powered by public <a href="https://cobalt.tools" target="_blank" rel="noopener">cobalt</a> instances.
  If all instances are busy, use the fallback link that appears above.
  Only download content you have the rights to save.
</footer>

<script>
(() => {
  // Fallback cobalt API instances if the live registry can't be reached.
  // Current ones are listed at https://instances.cobalt.best
  const SEED_INSTANCES = [
    "https://cobalt-api.meowing.de",
    "https://cobalt-api.kwiatekmiki.com",
    "https://capi.oak.li",
    "https://cobalt-backend.canine.tools",
    "https://api.dwnld.page",
  ];
  // Community-maintained registries of healthy cobalt instances
  const REGISTRIES = [
    "https://instances.cobalt.best/api/instances.json",
    "https://instances.hyper.lol/instances.json",
  ];
  // CORS proxies for the Instagram-embed fallback strategy
  const PROXIES = [
    u => "https://api.allorigins.win/raw?url=" + encodeURIComponent(u),
    u => "https://corsproxy.io/?url=" + encodeURIComponent(u),
  ];

  const $ = id => document.getElementById(id);
  const urlInput = $("url"), status = $("status"), result = $("result");
  const preview = $("preview"), openLink = $("openLink");
  let currentUrl = null, currentBlob = null, currentName = "reel.mp4";

  function setStatus(msg, cls = "", busy = false) {
    status.className = "status " + cls;
    status.innerHTML = (busy ? '<span class="spinner"></span>' : "") + msg;
  }

  function normalize(raw) {
    try {
      const u = new URL(raw.trim());
      if (!/(^|\.)instagram\.com$/.test(u.hostname)) return null;
      const m = u.pathname.match(/\/(reel|reels|p|tv)\/([A-Za-z0-9_-]+)/);
      if (!m) return null;
      return `https://www.instagram.com/${m[1] === "reels" ? "reel" : m[1]}/${m[2]}/`;
    } catch { return null; }
  }

  function fetchT(url, opts = {}, ms = 10000) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), ms);
    return fetch(url, { ...opts, signal: ctrl.signal }).finally(() => clearTimeout(timer));
  }

  // Pull the live list of healthy, no-auth cobalt instances; fall back to seeds.
  async function getInstances() {
    for (const reg of REGISTRIES) {
      try {
        const list = await (await fetchT(reg)).json();
        if (!Array.isArray(list)) continue;
        const good = list
          .filter(i => {
            const online = i.online ?? i.api_online ?? (i.status === "online");
            const cors = i.cors ?? i.info?.cors ?? 1;
            const auth = i.auth ?? i.info?.auth ?? false;
            const ig = i.services?.instagram;
            return online && (cors === 1 || cors === true) && !auth && ig !== false;
          })
          .sort((a, b) => (b.score ?? 0) - (a.score ?? 0))
          .map(i => {
            const api = i.api || i.api_url || "";
            return api.startsWith("http") ? api : (i.protocol || "https") + "://" + api;
          })
          .filter(Boolean);
        if (good.length) return good.slice(0, 8);
      } catch { /* registry unreachable — try the next one */ }
    }
    return SEED_INSTANCES;
  }

  async function askInstance(base, target) {
    const res = await fetchT(base.replace(/\/$/, "") + "/", {
      method: "POST",
      headers: { "Accept": "application/json", "Content-Type": "application/json" },
      body: JSON.stringify({ url: target, videoQuality: "max", filenameStyle: "basic" }),
    }, 12000);
    const data = await res.json();
    if (data.status === "redirect" || data.status === "tunnel") {
      return { url: data.url, filename: data.filename || "reel.mp4" };
    }
    if (data.status === "picker" && Array.isArray(data.picker)) {
      const vid = data.picker.find(p => p.type === "video") || data.picker[0];
      if (vid) return { url: vid.url, filename: "reel.mp4" };
    }
    throw new Error(data?.error?.code || "unexpected response");
  }

  // Fallback: scrape the reel's public embed page through a CORS proxy and
  // pull the direct CDN video URL out of it.
  async function askEmbed(target) {
    const embedUrl = target + "embed/captioned/";
    for (const wrap of PROXIES) {
      try {
        const html = await (await fetchT(wrap(embedUrl), {}, 12000)).text();
        const m = html.match(/"video_url"\s*:\s*"([^"]+)"/) ||
                  html.match(/videoUrl&quot;:&quot;([^&]+?)&quot;/) ||
                  html.match(/"contentUrl"\s*:\s*"([^"]+)"/);
        if (m) {
          const url = JSON.parse('"' + m[1] + '"').replace(/&amp;/g, "&");
          if (/^https:\/\//.test(url)) return { url, filename: "reel.mp4" };
        }
      } catch { /* proxy failed — try the next one */ }
    }
    throw new Error("embed scrape failed");
  }

  async function go() {
    const target = normalize(urlInput.value);
    if (!target) {
      setStatus("That doesn't look like an Instagram reel/post link.", "err");
      return;
    }
    $("goBtn").disabled = true;
    result.style.display = "none";
    currentBlob = null; currentUrl = null;

    let hit = null;
    setStatus("Finding a working server…", "", true);
    const instances = await getInstances();
    for (let i = 0; i < instances.length; i++) {
      setStatus(`Trying server ${i + 1} of ${instances.length}…`, "", true);
      try { hit = await askInstance(instances[i], target); break; }
      catch { /* try the next instance */ }
    }
    if (!hit) {
      setStatus("Servers busy — trying a direct route…", "", true);
      try { hit = await askEmbed(target); } catch { /* fall through */ }
    }
    $("goBtn").disabled = false;

    if (!hit) {
      setStatus(
        'Couldn\'t fetch it right now. <a style="color:#d67aff" target="_blank" rel="noopener" href="https://cobalt.tools/#'
        + encodeURIComponent(target) + '">Open in cobalt.tools instead</a>', "err");
      return;
    }

    currentUrl = hit.url;
    currentName = hit.filename.endsWith(".mp4") ? hit.filename : "reel.mp4";
    openLink.href = currentUrl;
    preview.src = currentUrl;
    result.style.display = "block";
    setStatus("Got it — highest quality available. Preview below.", "ok");
  }

  async function save() {
    if (!currentUrl) return;
    const btn = $("saveBtn");
    btn.disabled = true;
    try {
      if (!currentBlob) {
        setStatus("Downloading video…", "", true);
        const res = await fetch(currentUrl);
        if (!res.ok) throw new Error("fetch failed");
        currentBlob = await res.blob();
      }
      const file = new File([currentBlob], currentName, { type: "video/mp4" });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        // iPhone: pick "Save Video" in the share sheet to drop it into Photos
        await navigator.share({ files: [file] });
        setStatus("Shared — choose “Save Video” to add it to Photos.", "ok");
      } else {
        const a = document.createElement("a");
        a.href = URL.createObjectURL(currentBlob);
        a.download = currentName;
        a.click();
        setStatus("Download started.", "ok");
      }
    } catch (e) {
      if (e.name === "AbortError") { setStatus("", ""); }
      else {
        // CDN blocked the cross-origin fetch — fall back to opening the file
        setStatus("Couldn't save directly. Opening the file — long-press the video and choose “Save Video”.", "err");
        window.open(currentUrl, "_blank");
      }
    } finally { btn.disabled = false; }
  }

  $("goBtn").addEventListener("click", go);
  $("saveBtn").addEventListener("click", save);
  urlInput.addEventListener("keydown", e => { if (e.key === "Enter") go(); });
  $("pasteBtn").addEventListener("click", async () => {
    try {
      urlInput.value = await navigator.clipboard.readText();
      go();
    } catch { setStatus("Clipboard blocked — paste into the box manually.", "err"); }
  });
})();
</script>
</body>
</html>
