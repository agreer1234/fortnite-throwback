<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Reel Saver">
<meta name="theme-color" content="#0e1015">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<title>Reel Saver</title>
<style>
  :root {
    --bg: #0e1015; --card: #181b23; --text: #f2f4f8; --muted: #8b93a7;
    --border: #232733; --err: #ff6b6b; --ok: #3ddc84;
    --ig1: #feda75; --ig2: #d62976; --ig3: #962fbf; --ig4: #4f5bd5;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: radial-gradient(900px 500px at 50% -10%, #1c1a2e 0%, var(--bg) 60%);
    color: var(--text); min-height: 100vh;
    padding: calc(44px + env(safe-area-inset-top)) 20px calc(60px + env(safe-area-inset-bottom));
    display: flex; flex-direction: column; align-items: center;
  }
  header { text-align: center; margin-bottom: 26px; }
  .logo {
    width: 64px; height: 64px; border-radius: 16px; margin: 0 auto 14px;
    background: linear-gradient(45deg, var(--ig1), var(--ig2) 45%, var(--ig3) 70%, var(--ig4));
    display: flex; align-items: center; justify-content: center; font-size: 30px;
  }
  h1 { font-size: 1.7rem; font-weight: 800; letter-spacing: -0.5px; }
  .sub { color: var(--muted); margin-top: 6px; font-size: 0.95rem; }

  .card {
    width: 100%; max-width: 460px; background: var(--card);
    border: 1px solid var(--border); border-radius: 18px; padding: 18px;
  }
  .row { display: flex; gap: 8px; }
  input[type="url"] {
    flex: 1; min-width: 0; background: #10131a; color: var(--text);
    border: 1px solid var(--border); border-radius: 12px;
    padding: 14px 12px; font-size: 16px; outline: none;
  }
  input[type="url"]:focus { border-color: var(--ig3); }
  button {
    border: none; border-radius: 12px; font-size: 16px; font-weight: 700;
    padding: 14px 16px; cursor: pointer; color: #fff; -webkit-tap-highlight-color: transparent;
  }
  .paste { background: #262b38; }
  .go {
    width: 100%; margin-top: 10px;
    background: linear-gradient(45deg, var(--ig2), var(--ig3), var(--ig4));
  }
  button:disabled { opacity: 0.5; }

  .status { margin-top: 14px; font-size: 0.95rem; color: var(--muted); min-height: 1.3em; text-align: center; }
  .status.err { color: var(--err); }
  .status.ok { color: var(--ok); }
  .spinner {
    display: inline-block; width: 14px; height: 14px; vertical-align: -2px; margin-right: 8px;
    border: 2px solid var(--muted); border-top-color: transparent; border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .result { margin-top: 16px; display: none; }
  .result video {
    width: 100%; border-radius: 12px; background: #000; max-height: 55vh;
  }
  .result .actions { display: flex; gap: 8px; margin-top: 10px; }
  .result .actions > * { flex: 1; text-align: center; }
  a.btn {
    display: block; text-decoration: none; color: #fff; font-weight: 700; font-size: 16px;
    padding: 14px 16px; border-radius: 12px; background: #262b38;
  }
  .save { background: linear-gradient(45deg, #11998e, #38ef7d); color: #06281c !important; }

  footer { margin-top: auto; padding-top: 30px; text-align: center; color: var(--muted); font-size: 0.8rem; max-width: 460px; }
  footer a { color: var(--muted); }

  details.diag { margin-top: 12px; color: var(--muted); font-size: 0.78rem; }
  details.diag summary { cursor: pointer; text-align: center; }
  details.diag pre {
    margin-top: 8px; padding: 10px; background: #10131a; border: 1px solid var(--border);
    border-radius: 10px; white-space: pre-wrap; word-break: break-all;
    font-family: ui-monospace, Menlo, monospace; font-size: 0.72rem; max-height: 40vh; overflow-y: auto;
  }
</style>
</head>
<body>
<header>
  <div class="logo">🎬</div>
  <h1>Reel Saver</h1>
  <div class="sub">Paste an Instagram reel link, get the highest-res video</div>
</header>

<div class="card">
  <div class="row">
    <input id="url" type="url" inputmode="url" autocapitalize="off" autocorrect="off"
           placeholder="https://www.instagram.com/reel/…">
    <button class="paste" id="pasteBtn" type="button">Paste</button>
  </div>
  <button class="go" id="goBtn" type="button">Get video</button>
  <div class="status" id="status"></div>

  <div class="result" id="result">
    <video id="preview" controls playsinline preload="metadata"></video>
    <div class="actions">
      <button class="save" id="saveBtn" type="button">Save to Photos</button>
      <a class="btn" id="openLink" target="_blank" rel="noopener">Open file</a>
    </div>
  </div>

  <details class="diag" id="diag" style="display:none">
    <summary>details</summary>
    <pre id="diagLog"></pre>
  </details>
</div>

<footer>
  Powered by public <a href="https://cobalt.tools" target="_blank" rel="noopener">cobalt</a> instances.
  If all instances are busy, use the fallback link that appears above.
  Only download content you have the rights to save.
  <div style="margin-top:6px; opacity:0.6">v5</div>
</footer>

<script>
(() => {
  // ---- data sources -------------------------------------------------------
  // Last-resort cobalt API instances if every registry is unreachable
  const SEED_INSTANCES = [
    "https://cobalt-api.meowing.de",
    "https://cobalt-api.kwiatekmiki.com",
    "https://capi.oak.li",
    "https://cobalt-backend.canine.tools",
    "https://api.dwnld.page",
  ];
  // Community trackers of cobalt instances. cobalt.directory actually
  // test-downloads from each service, so its "working" list is best.
  const REGISTRIES = [
    "https://cobalt.directory/api/working?type=api",
    "https://cobalt.directory/api/tests",
    "https://instances.cobalt.best/api/instances.json",
    "https://instances.hyper.lol/instances.json",
  ];
  // Public CORS proxies. Instagram CDN links are signed against the IP that
  // requested them, so a link obtained through a proxy must also be fetched
  // through that same proxy.
  const PROXIES = [
    { name: "allorigins", wrap: u => "https://api.allorigins.win/raw?url=" + encodeURIComponent(u) },
    { name: "codetabs",   wrap: u => "https://api.codetabs.com/v1/proxy?quest=" + encodeURIComponent(u) },
    { name: "corsproxy",  wrap: u => "https://corsproxy.io/?url=" + encodeURIComponent(u) },
    { name: "thingproxy", wrap: u => "https://thingproxy.freeboard.io/fetch/" + u },
  ];

  // ---- helpers ------------------------------------------------------------
  const $ = id => document.getElementById(id);
  const urlInput = $("url"), status = $("status"), result = $("result");
  const preview = $("preview"), openLink = $("openLink"), diagLog = $("diagLog");
  let currentBlob = null, currentName = "reel.mp4", objectUrl = null;
  let log = [];

  function note(msg) {
    log.push(msg);
    diagLog.textContent = log.join("\n");
    $("diag").style.display = "block";
  }

  function setStatus(msg, cls = "", busy = false) {
    status.className = "status " + cls;
    status.innerHTML = (busy ? '<span class="spinner"></span>' : "") + msg;
  }

  const mb = b => (b / 1048576).toFixed(1) + " MB";

  function normalize(raw) {
    try {
      const u = new URL(raw.trim());
      if (!/(^|\.)instagram\.com$/.test(u.hostname)) return null;
      const m = u.pathname.match(/\/(reel|reels|p|tv)\/([A-Za-z0-9_-]+)/);
      if (!m) return null;
      return `https://www.instagram.com/${m[1] === "reels" ? "reel" : m[1]}/${m[2]}/`;
    } catch { return null; }
  }

  function fetchT(url, opts = {}, ms = 10000) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), ms);
    return fetch(url, { ...opts, signal: ctrl.signal }).finally(() => clearTimeout(timer));
  }

  // GET a URL directly first, then through each CORS proxy until one works
  async function getJson(url) {
    const attempts = [u => u, ...PROXIES.map(p => p.wrap)];
    let lastErr;
    for (const wrap of attempts) {
      try {
        const res = await fetchT(wrap(url), {}, 8000);
        if (!res.ok) throw new Error("HTTP " + res.status);
        return await res.json();
      } catch (e) { lastErr = e; }
    }
    throw lastErr;
  }

  // Stream a URL to a Blob exactly once, reporting progress. Cobalt tunnel
  // links are single-use, so this is the only fetch the video ever gets:
  // preview and save both run off the resulting Blob.
  async function download(url) {
    const ctrl = new AbortController();
    let guard = setTimeout(() => ctrl.abort(), 15000); // until first response
    const res = await fetch(url, { signal: ctrl.signal });
    clearTimeout(guard);
    if (!res.ok) throw new Error("HTTP " + res.status);

    const type = res.headers.get("content-type") || "";
    if (/json|text\/html/i.test(type)) throw new Error("got " + type.split(";")[0] + ", not video");

    const total = +res.headers.get("content-length") || 0;
    const reader = res.body && res.body.getReader ? res.body.getReader() : null;
    let blob;
    if (!reader) {
      blob = await res.blob(); // older Safari: no streaming, just wait
    } else {
      const chunks = [];
      let got = 0;
      // abort only if the stream stalls, never mid-flow on a slow connection
      let stall = setTimeout(() => ctrl.abort(), 30000);
      for (;;) {
        const { done, value } = await reader.read();
        if (done) break;
        clearTimeout(stall);
        stall = setTimeout(() => ctrl.abort(), 30000);
        chunks.push(value);
        got += value.length;
        setStatus(total ? `Downloading… ${mb(got)} of ${mb(total)}`
                        : `Downloading… ${mb(got)}`, "", true);
      }
      clearTimeout(stall);
      blob = new Blob(chunks, { type: "video/mp4" });
    }
    if (blob.size < 10000) throw new Error("only " + blob.size + " bytes, not a video");
    return blob;
  }

  // ---- instance discovery -------------------------------------------------
  function toApiUrl(v) {
    if (typeof v !== "string" || !v) return null;
    return v.startsWith("http") ? v : "https://" + v;
  }

  // Accepts any of the registry shapes and returns cobalt API base URLs
  // that look Instagram-capable, best first.
  function parseRegistry(json) {
    const body = json?.data ?? json;
    // cobalt.directory /api/working: { instagram: ["api.host", ...], ... }
    if (body && !Array.isArray(body) && Array.isArray(body.instagram)) {
      return body.instagram.map(toApiUrl).filter(Boolean);
    }
    // array-of-instances shapes (tests / instances.json)
    const arr = Array.isArray(body) ? body : (Array.isArray(body?.instances) ? body.instances : null);
    if (!arr) return [];
    return arr
      .filter(i => {
        if (typeof i !== "object" || !i) return false;
        const online = i.online ?? i.api_online ?? (i.status !== "offline");
        const cors = i.cors ?? i.info?.cors ?? 1;
        const auth = i.auth ?? i.info?.auth ?? false;
        const igRaw = i.services?.instagram ?? i.tests?.instagram;
        const ig = typeof igRaw === "object" && igRaw ? (igRaw.status ?? igRaw.working) : igRaw;
        return online && (cors === 1 || cors === true) && !auth &&
               (ig === true || ig === "true" || ig === undefined);
      })
      .sort((a, b) => (b.score ?? 0) - (a.score ?? 0))
      .map(i => toApiUrl(i.api || i.api_url || i.domain))
      .filter(Boolean);
  }

  async function getInstances() {
    for (const reg of REGISTRIES) {
      try {
        const found = parseRegistry(await getJson(reg));
        note(`registry ${new URL(reg).hostname}: ${found.length} usable instances`);
        if (found.length) return found.slice(0, 10);
      } catch (e) {
        note(`registry ${new URL(reg).hostname}: failed (${e.message || e.name})`);
      }
    }
    note("all registries failed, using built-in seed list");
    return SEED_INSTANCES;
  }

  // ---- link resolution ----------------------------------------------------
  async function askInstance(base, target) {
    const host = new URL(base).hostname;
    const res = await fetchT(base.replace(/\/$/, "") + "/", {
      method: "POST",
      headers: { "Accept": "application/json", "Content-Type": "application/json" },
      body: JSON.stringify({ url: target, videoQuality: "max", filenameStyle: "basic" }),
    }, 9000);
    const data = await res.json();
    let url = null;
    if (data.status === "redirect" || data.status === "tunnel") url = data.url;
    else if (data.status === "picker" && Array.isArray(data.picker)) {
      url = (data.picker.find(p => p.type === "video") || data.picker[0] || {}).url;
    }
    if (!url) throw new Error(data?.error?.code || "HTTP " + res.status);
    return { url, filename: data.filename || "reel.mp4", src: host };
  }

  // Scrape the reel's public embed page for the CDN video URL. The page is
  // fetched through a proxy, so the media must come back the same way.
  async function askEmbed(target) {
    const embedUrl = target + "embed/captioned/";
    const out = [];
    for (const p of PROXIES) {
      try {
        const res = await fetchT(p.wrap(embedUrl), {}, 12000);
        const html = await res.text();
        const m = html.match(/"video_url"\s*:\s*"([^"]+)"/) ||
                  html.match(/videoUrl&quot;:&quot;([^&]+?)&quot;/) ||
                  html.match(/"contentUrl"\s*:\s*"([^"]+)"/);
        if (!m) { note(`embed via ${p.name}: fetched ${html.length}b, no video URL`); continue; }
        const raw = JSON.parse('"' + m[1] + '"').replace(/&amp;/g, "&");
        if (!/^https:\/\//.test(raw)) continue;
        note(`embed via ${p.name}: found CDN link`);
        out.push({ url: p.wrap(raw), filename: "reel.mp4", src: p.name + " (proxied)" });
        out.push({ url: raw, filename: "reel.mp4", src: p.name + " (direct)" });
      } catch (e) {
        note(`embed via ${p.name}: ${e.message || e.name}`);
      }
    }
    return out;
  }

  // ---- main flow ----------------------------------------------------------
  function present(blob, name, src) {
    if (objectUrl) URL.revokeObjectURL(objectUrl);
    currentBlob = blob;
    currentName = name.endsWith(".mp4") ? name : "reel.mp4";
    objectUrl = URL.createObjectURL(blob);
    preview.src = objectUrl;
    openLink.href = objectUrl;
    openLink.setAttribute("download", currentName);
    result.style.display = "block";
    note(`downloaded ${mb(blob.size)} from ${src}`);
    setStatus(`Got it — ${mb(blob.size)}. Tap “Save to Photos”.`, "ok");
  }

  async function go() {
    const target = normalize(urlInput.value);
    if (!target) {
      setStatus("That doesn't look like an Instagram reel/post link.", "err");
      return;
    }
    $("goBtn").disabled = true;
    result.style.display = "none";
    currentBlob = null;
    log = []; diagLog.textContent = ""; $("diag").style.display = "none";

    let done = false;

    // Strategy 1: public cobalt instances
    setStatus("Finding a working server…", "", true);
    const instances = await getInstances();
    for (let i = 0; i < instances.length && !done; i++) {
      const host = new URL(instances[i]).hostname;
      setStatus(`Trying server ${i + 1} of ${instances.length}…`, "", true);
      let cand;
      try {
        cand = await askInstance(instances[i], target);
        note(`${host}: returned a link`);
      } catch (e) {
        note(`${host}: ${e.message || e.name}`);
        continue;
      }
      setStatus("Downloading video…", "", true);
      try {
        present(await download(cand.url), cand.filename, cand.src);
        done = true;
      } catch (e) {
        note(`  ↳ download failed: ${e.message || e.name}`);
      }
    }

    // Strategy 2: scrape the public embed page
    if (!done) {
      setStatus("Servers busy — trying a direct route…", "", true);
      for (const cand of await askEmbed(target)) {
        setStatus(`Downloading via ${cand.src}…`, "", true);
        try {
          present(await download(cand.url), cand.filename, cand.src);
          done = true;
          break;
        } catch (e) {
          note(`  ↳ ${cand.src}: ${e.message || e.name}`);
        }
      }
    }

    $("goBtn").disabled = false;
    if (!done) {
      setStatus(
        'Couldn\'t fetch it right now. <a style="color:#d67aff" target="_blank" rel="noopener" href="https://cobalt.tools/#'
        + encodeURIComponent(target) + '">Open in cobalt.tools instead</a>', "err");
    }
  }

  // ---- saving -------------------------------------------------------------
  // The video is already in memory, so this never touches the network.
  async function save() {
    if (!currentBlob) return;
    const btn = $("saveBtn");
    btn.disabled = true;
    try {
      const file = new File([currentBlob], currentName, { type: "video/mp4" });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        // iPhone: pick "Save Video" in the share sheet to drop it into Photos
        await navigator.share({ files: [file] });
        setStatus("Shared — choose “Save Video” to add it to Photos.", "ok");
      } else {
        const a = document.createElement("a");
        a.href = objectUrl;
        a.download = currentName;
        a.click();
        setStatus("Download started — check your Files app.", "ok");
      }
    } catch (e) {
      if (e.name === "AbortError") setStatus("", "");
      else setStatus("Share failed: " + (e.message || e.name) + ". Try “Open file”, then long-press the video.", "err");
    } finally { btn.disabled = false; }
  }

  $("goBtn").addEventListener("click", go);
  $("saveBtn").addEventListener("click", save);
  urlInput.addEventListener("keydown", e => { if (e.key === "Enter") go(); });
  $("pasteBtn").addEventListener("click", async () => {
    try {
      urlInput.value = await navigator.clipboard.readText();
      go();
    } catch { setStatus("Clipboard blocked — paste into the box manually.", "err"); }
  });
})();
</script>
</body>
</html>
